<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>XD Auto Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: frosted top bar, big title, New / Used switch, model chips, one sortable table with a filter row,
   side panel for one truck; a list replaces the table on narrow screens. */
:root{
  --bg:#f5f5f7; --panel:#ffffff; --fill:#f2f2f4; --fill2:#e8e8ed; --hover:#f7f7f9; --ink:#1d1d1f; --muted:#6e6e73; --faint:#a1a1a6;
  --line:#e3e3e8; --line-strong:#d2d2d7;
  --accent:#0071e3; --accent-hover:#0077ed; --accent-ink:#ffffff; --accent-soft:#e8f1fc;
  --ok:#248a3d; --warn:#b25000;
  --glass:rgba(245,245,247,.72); --scrim:rgba(0,0,0,.28);
  --shadow:0 2px 6px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06);
  --shadow-lg:0 20px 60px rgba(0,0,0,.18);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue","Segoe UI",Arial,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue","Segoe UI",Arial,sans-serif;
  --f-mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --panel:#1c1c1e; --fill:#2c2c2e; --fill2:#3a3a3c; --hover:#242426; --ink:#f5f5f7; --muted:#a1a1a6; --faint:#6e6e73;
  --line:#2c2c2e; --line-strong:#3a3a3c;
  --accent:#2997ff; --accent-hover:#47a6ff; --accent-ink:#ffffff; --accent-soft:#0f2742;
  --ok:#30d158; --warn:#ff9f0a;
  --glass:rgba(22,22,23,.72); --scrim:rgba(0,0,0,.5);
  --shadow:0 0 0 1px rgba(255,255,255,.06); --shadow-lg:0 0 0 1px rgba(255,255,255,.08),0 20px 60px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#1c1c1e; --fill:#2c2c2e; --fill2:#3a3a3c; --hover:#242426; --ink:#f5f5f7; --muted:#a1a1a6; --faint:#6e6e73;
  --line:#2c2c2e; --line-strong:#3a3a3c;
  --accent:#2997ff; --accent-hover:#47a6ff; --accent-ink:#ffffff; --accent-soft:#0f2742;
  --ok:#30d158; --warn:#ff9f0a;
  --glass:rgba(22,22,23,.72); --scrim:rgba(0,0,0,.5);
  --shadow:0 0 0 1px rgba(255,255,255,.06); --shadow-lg:0 0 0 1px rgba(255,255,255,.08),0 20px 60px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.47 var(--f-body);letter-spacing:-.01em;margin:0;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;padding-inline:clamp(16px,3vw,40px)}
h1,h2{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}

/* frosted top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:6px 24px;flex-wrap:wrap;min-height:52px;padding-block:6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.03em;margin-right:8px;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(145deg,var(--ink),#555);display:inline-grid;place-items:center;color:var(--bg);font:700 10px/1 var(--f-display);font-style:normal;letter-spacing:0}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-right:auto}
.tab{border:0;background:none;padding:6px 12px;border-radius:980px;cursor:pointer;color:var(--muted);font-size:13.5px}
.tab:hover{color:var(--ink)}
.tab[aria-current="true"]{color:var(--ink);font-weight:600}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;font-size:13px;color:var(--muted)}
main{padding-block:8px 72px}

/* hero */
.hero{padding-block:clamp(28px,5vw,56px) 22px;display:grid;gap:18px}
.hero h1{font-size:clamp(34px,5vw,56px);font-weight:700;letter-spacing:-.035em}
.hero p{margin:0;font-size:clamp(16px,1.6vw,21px);color:var(--muted);max-width:56ch;letter-spacing:-.015em}
.seg-ctl{display:inline-flex;background:var(--fill2);border-radius:980px;padding:3px;justify-self:start}
.seg-ctl button{border:0;background:none;border-radius:980px;padding:7px 22px;cursor:pointer;font-weight:500;color:var(--ink)}
.seg-ctl button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 6px}
.chip{flex:none;border:1px solid var(--line-strong);background:var(--panel);border-radius:980px;padding:7px 15px;cursor:pointer;font-size:14px;display:inline-flex;gap:7px;align-items:baseline;white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.chip small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
@media (max-width:819px){.chips{gap:6px}.chips .chip{padding:6px 11px;font-size:13.5px;gap:5px}}

/* toolbar above the table */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:6px 0 14px}
.count{color:var(--muted);font-variant-numeric:tabular-nums}
.toolbar .count{margin-right:auto;font-size:14px}
.qbox{flex:0 1 320px;min-width:0;border:0;background:var(--fill);border-radius:980px;padding:6px 14px;font-size:13.5px}
.qbox::placeholder{color:var(--muted)}
.dsort{border:0;background:var(--fill);border-radius:980px;padding:6px 14px;font-size:13.5px;font-weight:500;cursor:pointer}
@media (max-width:819px){.qbox{flex:1 1 100%;order:3;padding:9px 14px;font-size:16px}.dsort{display:none}}
td.disc,.save{color:var(--ok);font-weight:600}
.call{color:var(--muted);font-weight:500}
.deal{--dc:var(--muted);color:var(--dc);display:inline-flex;align-items:center;font-size:12px;font-weight:600;white-space:nowrap;padding:2px 9px;border-radius:980px;background:color-mix(in srgb,var(--dc) 12%,transparent)}
.deal.good{--dc:var(--ok)}

.btn{border:0;background:var(--fill);padding:8px 16px;border-radius:980px;cursor:pointer;white-space:nowrap;font-size:14px;font-weight:500;color:var(--ink);transition:background .15s}
.btn:hover{background:var(--fill2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:none;color:var(--accent)}
.btn.ghost:hover{text-decoration:underline}
.btn.small{padding:5px 12px;font-size:13px}
a.btn{display:inline-block;text-decoration:none}

/* the table card: the page scrolls the table (no inner scroll box), clip keeps the rounded corners without breaking sticky */
.card{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;overflow:clip}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
thead th{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,52px));z-index:2;background:var(--panel);font-weight:600;font-size:12px;color:var(--muted);letter-spacing:0;border-bottom:0;padding-top:14px}
thead tr.frow th{top:calc(env(safe-area-inset-top,0px) + var(--toph,52px) + var(--h1,40px));padding:4px 5px 10px;border-bottom:1px solid var(--line)}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th .arr{font-size:9px;margin-left:4px;opacity:0}
th.sort:hover .arr{opacity:.5}
th.sorted{color:var(--ink)}
th.sorted .arr{opacity:1;color:var(--accent)}
.frow select,.frow input{width:100%;min-width:0;padding:5px 8px;border:0;border-radius:8px;background:var(--fill);font-size:12.5px;appearance:none;-webkit-appearance:none}
.frow select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 11px) 52%,calc(100% - 7px) 52%;background-size:4px 4px;background-repeat:no-repeat;padding-right:20px}
.frow select:focus,.frow input:focus{outline:2px solid var(--accent);outline-offset:0}
.frow .on{background-color:var(--accent-soft);color:var(--accent);font-weight:500}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover td{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.idx{color:var(--faint);text-align:right;font-size:12px}
td.strong{font-weight:600}
td.wrapc{white-space:normal;min-width:110px;max-width:220px}
td .sub{font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
td .mk{color:var(--muted);font-weight:400}
td.none{padding:24px;text-align:center;color:var(--muted);cursor:default;white-space:normal}
@media (max-width:1399px){.h-lg{display:none}}
@media (max-width:1199px){.h-md{display:none}}
@media (max-width:1019px){.h-sm{display:none}}
.cdot{display:inline-flex;align-items:center;gap:7px;max-width:100%}
.cdot::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--c,transparent);border:1px solid var(--line-strong);box-sizing:border-box}

/* phones and narrow windows: a list instead of the table */
.mfilters,.mlist{display:none}
@media (max-width:819px){
  .sheetwrap{display:none}
  .mlist{display:block}
  .mfilters{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 6px;scrollbar-width:thin}
  .mfilters select,.mfilters input{flex:none;border:1px solid var(--line-strong);background-color:var(--panel);border-radius:980px;padding:7px 28px 7px 13px;font-size:14px;appearance:none;-webkit-appearance:none;max-width:200px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 11px) 52%;background-size:4px 4px;background-repeat:no-repeat}
  .mfilters input{width:118px;padding-right:13px;background-image:none}
  .mfilters .on{background-color:var(--ink);color:var(--bg);border-color:var(--ink)}
  .who .plain{display:none}
  .hero{padding-block:22px 14px;gap:14px}
  .hero p{font-size:15px}
  .toolbar{margin:2px 0 10px}
}
.mrow{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.mrow:last-child{border-bottom:0}
.mrow:active{background:var(--hover)}
.mmain{flex:1;min-width:0;display:grid;gap:3px}
.mtitle{font-weight:600;font-size:16px;letter-spacing:-.015em}
.mtitle span{font-weight:400}
.msub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msub .cdot{gap:5px;vertical-align:bottom}
.msub .cdot::before{width:10px;height:10px}
.mside{text-align:right;display:grid;gap:2px;justify-items:end;flex:none}
.mprice{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.mprice.call{font-size:14px}
.mempty{padding:28px 16px;text-align:center;color:var(--muted)}
.foot{margin:16px auto 0;font-size:12.5px;color:var(--muted);text-align:center;max-width:110ch;display:grid;gap:6px}
.foot p{margin:0}

/* side panel */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;justify-content:flex-end;padding:12px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet{background:var(--panel);width:min(500px,100%);height:100%;overflow:auto;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px));display:grid;grid-auto-rows:max-content;gap:16px;align-content:start;border-radius:22px;box-shadow:var(--shadow-lg)}
@media (max-width:640px){.scrim{align-items:flex-end;padding:0}.sheet{height:auto;max-height:92%;border-radius:22px 22px 0 0}}
.sheet-head{display:flex;gap:12px;align-items:flex-start}
.sheet-head h2{font-size:26px;margin-right:auto;letter-spacing:-.025em}
.sheet-head .btn{width:30px;height:30px;padding:0;display:grid;place-items:center;font-size:0;flex:none}
.sheet-head .btn::before{content:"✕";font-size:13px;color:var(--muted)}
.sticker{background:var(--fill);border-radius:14px;overflow:hidden}
.sticker .sh{padding:12px 16px 4px;display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:600;color:var(--muted)}
.sticker dl{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);margin:0;padding:0 16px 8px}
.sticker dt,.sticker dd{padding:9px 0;border-top:1px solid var(--line-strong);margin:0;font-size:14px}
.sticker dl > :nth-child(-n+2){border-top:0}
.sticker dt{color:var(--muted);padding-right:16px}
.sticker dd{min-width:0;overflow-wrap:anywhere;text-align:right}
.sticker dd .sub{font-size:12px;line-height:1.35;color:var(--muted);margin-top:4px}
.sticker dl.opts dt{color:var(--ink);font-size:13.5px}
.sticker dl.opts dd{font-size:13.5px;white-space:nowrap}
.sticker dl.opts .tot{font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:980px;z-index:60;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <span class="brand"><i aria-hidden="true">XD</i>XD Auto</span>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-tab="new">New</button>
      <button class="tab" data-tab="used">Used</button>
    </nav>
    <div class="who" id="who"></div>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1 id="sec-title"></h1>
    <p id="sec-blurb"></p>
    <div class="seg-ctl" role="group" aria-label="Condition">
      <button data-tab="new" aria-pressed="false">New</button><button data-tab="used" aria-pressed="false">Used</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Models"></div>
  </div>
  <div class="toolbar">
    <span class="count" id="rescount"></span>
    <input id="q" class="qbox" type="search" placeholder="Search model, trim, color or stock #" aria-label="Search trucks" autocomplete="off">
    <select id="dsort" class="dsort" aria-label="Sort"></select>
    <button class="btn small ghost" id="clearf" hidden>Clear filters</button>
  </div>
  <div class="mfilters" id="mfilters" role="group" aria-label="Filters"></div>
  <div class="card"><div class="sheetwrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="mlist" id="mlist"></div></div>
  <div class="foot" id="foot"></div>
</main>

<div id="sheet-slot"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  $$("#thead select[data-fk], #mfilters select[data-fk]").forEach(sel => {
    const k = sel.dataset.fk, phone = !!sel.closest("#mfilters");
    sel.innerHTML = `<option value="">${phone ? COL[k].h + ": all" : "All"}</option>` + selOptions(k).map(x => `<option value="${esc(x)}"${f[k] === x ? " selected" : ""}>${esc(x)}</option>`).join("");
    sel.classList.toggle("on", hasVal(f[k]));
  });
  $$("#thead input[data-fk], #mfilters input[data-fk]").forEach(inp => inp.classList.toggle("on", hasVal(f[inp.dataset.fk])));
  const sv = `${S.sort[curSec()].k}:${S.sort[curSec()].dir}`;
  ["#msort", "#dsort"].forEach(id => { const el = $(id); if (el) el.value = [...el.options].some(o => o.value === sv) ? sv : ""; });
}
function sortedList(list) {
  const {k, dir} = S.sort[curSec()];
  if (k === "rec") return list.sort((a, b) => a._i - b._i);       // the order the listings come in: newest year, then lowest miles
  const c = COL[k];
  return list.sort((a, b) => {
    let x = c.get(a), y = c.get(b);
    if (k === "m") { x = modelRank(x); y = modelRank(y); }
    if (x == null || x === "") return 1;
    if (y == null || y === "") return -1;
    const r = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), undefined, {numeric: true});
    return r * dir || a._i - b._i;
  });
}
function renderInventory() {
  const sec = curSec(), f = S.f[sec];
  const list = sortedList(searched(secPool(sec).filter(v => passes(v, f)), S.q[sec]));
  const total = secPool(sec).length, nf = Object.values(f).filter(hasVal).length + (S.q[sec] ? 1 : 0);
  $("#sec-title").textContent = SECTIONS[sec].title;
  $("#sec-blurb").textContent = SECTIONS[sec].blurb;
  $$(".seg-ctl button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === sec)));
  $$(".tab").forEach(b => b.setAttribute("aria-current", String(b.dataset.tab === sec)));
  renderChips();
  $("#rescount").textContent = (nf ? `${list.length} of ${total}` : `${total} trucks`) + (built ? ` · updated ${built}` : "");
  $("#clearf").hidden = !nf;
  if ($("#q").value !== S.q[sec]) $("#q").value = S.q[sec];
  $("#tbody").innerHTML = list.map((v, i) => `<tr data-detail="${esc(v.id)}">
      <td class="idx num">${i + 1}</td>
      ${cols().map(k => { const c = COL[k], val = c.fmt ? c.fmt(v) : c.get(v) ?? "";
        return `<td class="${c.num ? "r num" : ""}${c.mono ? " mono" : ""}${c.cls ? " " + c.cls : ""}${hideCls(k)}">${c.raw ? val : esc(val)}</td>`; }).join("")}
    </tr>`).join("") || `<tr><td class="none" colspan="${cols().length + 1}">No trucks match. Clear a filter or try another search.</td></tr>`;
  $("#mlist").innerHTML = list.map(mrow).join("") || `<div class="mempty">No trucks match. Clear a filter or try another search.</div>`;
  $("#foot").innerHTML = (sec === "new"
    ? `<p>Brand-new trucks, subject to availability. Send us a stock number and we quote today's delivered price in US dollars.</p>`
    : `<p>Prices are in US dollars, delivered to your lot in Texas. Texas market is the median asking price of comparable Texas listings. Mileage is rounded to the nearest 1,000. Every truck is subject to availability.</p>
       <p>US-built trucks previously registered in Canada, disclosed up front. Factory options come from the original window sticker, priced in Canadian dollars as printed.</p>`)
    + `<p>How it works: send us a stock number, we confirm availability and send photos, a walk-around video and the history report, then deliver the truck to your lot. XD Auto has supplied dealers in Utah for nearly ten years.</p>`
    + (contactLine() ? `<p>${contactLine()}</p>` : "");
}
function mrow(v) {
  const sub1 = [v.y, v.sec === "used" ? esc(v.mi) : "", colourCell(v)].filter(Boolean).join(" · ");
  const sub2 = [engLabel(v), driveLabel(v), v.id].filter(Boolean).map(esc).join(" · ");
  return `<div class="mrow" data-detail="${esc(v.id)}" role="button" tabindex="0">
    <div class="mmain"><div class="mtitle">${esc(v.m)} <span>${esc(v.t)}</span></div>
      <div class="msub">${sub1}</div><div class="msub">${sub2}</div></div>
    <div class="mside">${v.price == null ? `<div class="mprice call">Call for price</div>`
      : `<div class="mprice">${money(v.price)}</div><div class="msub">Texas ${money(v.tx)}</div><div class="msub save">−${money(saveOf(v))}</div>`}${histBadge(v)}</div>
  </div>`;
}
function renderChips() {
  const sec = curSec(), f = S.f[sec], pool = secPool(sec);
  const chip = (val, label, n) => `<button class="chip" data-chip="${esc(val)}" aria-pressed="${(f.m || "") === val}">${esc(label)}<small>${n}</small></button>`;
  const models = uniq(pool.map(v => v.m)).sort((a, b) => modelRank(a) - modelRank(b) || a.localeCompare(b));
  $("#chips").innerHTML = chip("", "All", pool.length) + models.map(m => chip(m, m, pool.filter(v => v.m === m).length)).join("");
}
// the sticky table header sits right under the frosted top bar, whose height changes when it wraps
function syncSticky() {
  const root = document.documentElement.style, row = $("#thead tr");
  root.setProperty("--toph", $(".top").getBoundingClientRect().height + "px");
  if (row) root.setProperty("--h1", Math.floor(row.getBoundingClientRect().height) - 1 + "px");
}
function setTab(tab) {
  S.tab = tab === "used" ? "used" : "new";
  mem.set("xdstore.tab", S.tab);
  try { history.replaceState(null, "", "#" + S.tab); } catch {}
  buildHead(); renderInventory(); syncSticky();
}

/* ---------- contact ---------- */
function contactLine() {
  const how = [CONTACT.phone && `text or call <span class="mono">${esc(CONTACT.phone)}</span>`, CONTACT.email && `email <span class="mono">${esc(CONTACT.email)}</span>`].filter(Boolean);
  return how.length ? `Dealer inquiries${CONTACT.name ? " · " + esc(CONTACT.name) : ""}: ${how.join(" or ")}.` : "";
}

/* ---------- side panel ---------- */
function openSheet(html) {
  $("#sheet-slot").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const first = $("#sheet-slot").querySelector("button");
  first && first.focus();
}
function closeSheet() {
  if (!$("#scrim")) return;
  $("#sheet-slot").innerHTML = "";
  try { history.replaceState(null, "", "#" + curSec()); } catch {}
}
function detailHtml(v) {
  const s = v.spec, used = v.sec === "used";
  const rows = [
    ["Stock #", `<span class="mono">${esc(v.id)}</span>`],
    ["Condition", used ? "Used" : "New"],
    used ? ["Mileage", `<span class="num">${esc(v.mi)}</span>`] : null,
    ["Model year", v.y], ["Trim", esc(v.t)], ["Exterior", esc(v.c || "On request")],
    engFull(v) ? ["Engine", esc(engFull(v))] : null,
    driveLabel(v) ? ["Drive", esc(driveLabel(v))] : null,
    cab(v) ? ["Cab", esc(cab(v))] : null,
    s && s.group ? ["Equipment group", esc(s.group)] : null,
    v.price == null ? ["Delivered price (USD)", "Call for price"] : ["Delivered price (USD)", `<b class="num">${money(v.price)}</b>`],
    v.price == null ? null : ["Texas market", `<span class="num">${money(v.tx)}</span><div class="sub">median of ${v.n} comparable Texas listings</div>`],
    v.price == null ? null : ["Below market", `<span class="num save">${money(saveOf(v))}</span> · ${savePct(v)}%`],
    used ? ["History", v.hist === "clean" ? `${histBadge(v)}<div class="sub">No accidents or damage on the history report.</div>` : "History report sent on request"] : null,
  ].filter(Boolean);
  const opts = s && s.items && s.items.length ? `<div class="sticker"><div class="sh"><span>Factory options</span><span>Original window sticker · CAD</span></div>
      <dl class="opts">${s.items.map(([n, p]) => `<dt>${esc(n)}</dt><dd class="num">${p < 0 ? "−" + money(-p) : p ? money(p) : "Incl."}</dd>`).join("")}
        ${s.opt ? `<dt class="tot">Total options</dt><dd class="num tot">${money(s.opt)}</dd>` : ""}
        ${s.msrp ? `<dt class="tot">Original MSRP</dt><dd class="num tot">${money(s.msrp)}</dd>` : ""}</dl></div>`
    : s && s.msrp ? `<p class="hint">Original MSRP ${money(s.msrp)} CAD. Full factory option list on request.</p>` : "";
  const mail = CONTACT.email ? `<a class="btn" href="mailto:${esc(CONTACT.email)}?subject=${encodeURIComponent("Stock # " + v.id)}">Email us</a>` : "";
  return `<div class="sheet-head"><h2>${esc(vTitle(v))}</h2><button class="btn ghost" data-close aria-label="Close">Close</button></div>
    <div class="sticker"><div class="sh"><span>Vehicle summary</span><span>${used ? "Used" : "New"}</span></div>
      <dl>${rows.map(([k, x]) => `<dt>${k}</dt><dd>${x}</dd>`).join("")}</dl></div>
    ${opts}
    <div class="links"><button class="btn primary" data-copy="${esc(v.id)}">Copy stock #</button>${mail}<button class="btn" data-copylink="${esc(v.id)}">Copy link</button></div>
    <p class="hint">To check availability, send us stock # <b class="mono">${esc(v.id)}</b>. We reply with photos, a walk-around video and the history report. ${contactLine()}</p>
    <p class="hint">${used ? "The price is in US dollars, delivered to your lot in Texas." : "Brand-new. We quote today's delivered price in US dollars when you send the stock number."}</p>`;
}
function showTruck(v) {
  openSheet(detailHtml(v));
  try { history.replaceState(null, "", "#" + v.id); } catch {}
}
async function copyText(text, done) {
  try { await navigator.clipboard.writeText(text); toast(done); }
  catch { toast(text); }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  const tab = t.closest("[data-tab]");
  if (tab) return setTab(tab.dataset.tab);
  const chip = t.closest("[data-chip]");
  if (chip) { S.f[curSec()].m = chip.dataset.chip; buildHead(); renderInventory(); return; }
  if (t.closest("#clearf")) { S.f[curSec()] = {}; S.q[curSec()] = ""; buildHead(); renderInventory(); return; }
  const th = t.closest("th[data-sortk]");
  if (th) { const so = S.sort[curSec()], k = th.dataset.sortk;
    S.sort[curSec()] = so.k === k ? {k, dir: -so.dir} : {k, dir: ["y", "save", "tx"].includes(k) ? -1 : 1};
    buildHead(); renderInventory(); return; }
  if (t.closest("[data-close]") || t.id === "scrim") return closeSheet();
  const cp = t.closest("[data-copy]");
  if (cp) return copyText(cp.dataset.copy, "Stock # copied");
  const cl = t.closest("[data-copylink]");
  if (cl) return copyText(location.href.split("#")[0] + "#" + cl.dataset.copylink, "Link copied");
  const row = t.closest("[data-detail]");
  if (row && byId[row.dataset.detail]) showTruck(byId[row.dataset.detail]);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if (e.key === "Enter" && e.target.matches && e.target.matches(".mrow")) e.target.click();
});
const onFilter = e => {
  const el = e.target.closest("[data-fk]");
  if (!el) return;
  S.f[curSec()][el.dataset.fk] = el.value.trim();
  renderInventory(); refreshSelects();
};
document.addEventListener("change", e => {
  if (e.target.id === "dsort" || e.target.id === "msort") {
    const [k, dir] = e.target.value.split(":"); S.sort[curSec()] = {k, dir: +dir};
    buildHead(); renderInventory(); return;
  }
  onFilter(e);
});
let qTimer;
document.addEventListener("input", e => {
  if (e.target.id === "q") { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q[curSec()] = e.target.value.trim(); renderInventory(); refreshSelects(); }, 120); return; }
  if (e.target.matches("input[data-fk]")) onFilter(e);
});
window.addEventListener("resize", () => requestAnimationFrame(syncSticky));

/* ---------- start: #used / #new pick the section, #XD-xxxxx opens that truck ---------- */
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "new" || h === "used") return setTab(h);
  const v = byId[h.toUpperCase()];
  if (v) { setTab(v.sec); showTruck(v); return; }
  setTab(secPool(S.tab).length ? S.tab : S.tab === "new" ? "used" : "new");
}
window.addEventListener("hashchange", fromHash);
$("#who").innerHTML = [CONTACT.phone, CONTACT.email].filter(Boolean).map(x => `<span class="mono">${esc(x)}</span>`).join("") || `<span class="plain">Dealer inquiries welcome</span>`;
fromHash();
</script>
</body>
</html>
